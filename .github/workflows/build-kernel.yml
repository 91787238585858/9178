name: Build Camellia KernelSU v0.9.5 (Stable)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build 4.14.186 + KernelSU v0.9.5
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Clone Xiaomi kernel source
        run: |
          git clone --depth=1 --branch=camellian-t-oss \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel
          cd kernel
          echo "=== Kernel version ==="
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' Makefile

      - name: Integrate KernelSU v0.9.5
        run: |
          cd kernel
          curl -LSs -o setup.sh \
            https://raw.githubusercontent.com/tiann/KernelSU/v0.9.5/kernel/setup.sh
          sh setup.sh v0.9.5
          echo "=== KSU version check ==="
          KSU_VER=$(git -C KernelSU describe --tags 2>/dev/null || echo unknown)
          echo "KSU_VER=$KSU_VER"
          case "$KSU_VER" in
            v0.9.5*) echo "KSU version OK" ;;
            *) echo "FATAL: KSU tag is not v0.9.5 (got $KSU_VER)"; exit 1 ;;
          esac
          echo "=== Integration check ==="
          test -e drivers/kernelsu || { echo "FATAL: drivers/kernelsu missing"; exit 1; }
          grep -q "kernelsu" drivers/Makefile || { echo "FATAL: Makefile not patched"; exit 1; }
          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || { echo "FATAL: Kconfig not patched"; exit 1; }
          echo "KSU integration OK"

      - name: Patch OpenSSL 3.0 compatibility
        run: |
          cd kernel
          echo 'HOSTCFLAGS += -Wno-error -Wno-deprecated-declarations' >> Makefile
          echo 'HOSTCXXFLAGS += -Wno-error -Wno-deprecated-declarations' >> Makefile
          for f in scripts/extract-cert.c scripts/sign-file.c; do
            if [ -f "$f" ] && ! grep -q 'Wdeprecated-declarations' "$f"; then
              sed -i '1i #pragma GCC diagnostic ignored "-Wdeprecated-declarations"' "$f"
            fi
          done

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc libssl-dev bison flex \
            libelf-dev zip unzip git curl python3 perl rsync cpio binutils \
            device-tree-compiler kmod
          sudo apt-get install -y -qq libncurses-dev || sudo apt-get install -y -qq libncurses5-dev || true

      - name: Download toolchains
        run: |
          mkdir -p toolchain/clang toolchain/gcc64 toolchain/gcc32
          wget -q --no-check-certificate -O /tmp/clang.tar.gz \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b/archive/refs/heads/lineage-20.0.tar.gz
          tar xzf /tmp/clang.tar.gz -C /tmp
          mv /tmp/android_prebuilts_clang_kernel_linux-x86_clang-r416183b-*/* toolchain/clang/
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            toolchain/gcc64
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            toolchain/gcc32
          rm -f toolchain/clang/bin/ld
          ls -la toolchain/clang/bin/clang
          ls -la toolchain/gcc64/bin/aarch64-linux-android-gcc

      - name: Configure kernel
        run: |
          cd kernel
          DEFCONFIG_FILE=arch/arm64/configs/camellian_defconfig
          set_config() {
            local config=$1
            local value=$2
            local file=$3
            if grep -q "^# $config is not set" "$file"; then
              sed -i "s/^# $config is not set/$config=$value/" "$file"
            elif grep -q "^$config=" "$file"; then
              sed -i "s/^$config=.*/$config=$value/" "$file"
            else
              echo "$config=$value" >> "$file"
            fi
          }
          set_config CONFIG_KSU y "$DEFCONFIG_FILE"
          set_config CONFIG_KPROBES y "$DEFCONFIG_FILE"
          set_config CONFIG_HAVE_KPROBES y "$DEFCONFIG_FILE"
          set_config CONFIG_KPROBE_EVENTS y "$DEFCONFIG_FILE"
          set_config CONFIG_MODULES y "$DEFCONFIG_FILE"
          set_config CONFIG_EXT4_FS y "$DEFCONFIG_FILE"
          set_config CONFIG_DEBUG_INFO n "$DEFCONFIG_FILE"
          set_config CONFIG_LOCALVERSION '"-perf-ga368196f0bd0"' "$DEFCONFIG_FILE"
          set_config CONFIG_LOCALVERSION_AUTO n "$DEFCONFIG_FILE"
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH"
          make O=out ARCH=arm64 camellian_defconfig
          echo "=== Config check ==="
          grep -E "CONFIG_KSU=|CONFIG_KPROBES=|CONFIG_EXT4_FS=|CONFIG_MODULES=|CONFIG_DEBUG_INFO=|CONFIG_LOCALVERSION" out/.config
          grep -q "^CONFIG_KSU=y" out/.config || {
            echo "FATAL: CONFIG_KSU not enabled"
            grep -E "CONFIG_KSU|KPROBES|EXT4" out/.config
            exit 1
          }
          echo "CONFIG_KSU=y confirmed"

      - name: Build kernel
        run: |
          set -o pipefail
          cd kernel
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH"
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC="clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LD=ld.lld \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log" | tail -300
          echo "BUILD SUCCESS"
          ls -la out/arch/arm64/boot/

      - name: Verify kernel image
        run: |
          cd kernel
          test -f out/vmlinux || { echo "FATAL: vmlinux missing"; exit 1; }
          echo "=== KSU symbols in vmlinux ==="
          nm out/vmlinux 2>/dev/null | grep -i "ksu" | head -20 || true
          echo "=== KSU strings in vmlinux ==="
          strings out/vmlinux 2>/dev/null | grep -i "kernelsu" | head -10 || true
          if ! (nm out/vmlinux 2>/dev/null | grep -qi "ksu" || strings out/vmlinux 2>/dev/null | grep -qi "kernelsu"); then
            echo "FATAL: no KernelSU symbols found in vmlinux"
            exit 1
          fi
          cd out/arch/arm64/boot
          ls -la
          test -f Image.gz-dtb || { echo "FATAL: Image.gz-dtb missing"; exit 1; }
          python3 - <<'PYEOF'
          import zlib
          data = open('Image.gz-dtb','rb').read()
          print("image size: %.1f MB" % (len(data)/1024/1024))
          raw = None
          if data[:2] == b'\x1f\x8b':
              try:
                  d = zlib.decompressobj(16+zlib.MAX_WBITS)
                  raw = d.decompress(data)
                  print("gzip OK: kernel %.1f MB, dtb %d bytes" % (len(raw)/1024/1024, len(d.unused_data)))
              except Exception as e:
                  print("gzip failed: %s" % e)
          if raw is None:
              raw = data
          if b'4.14.186-perf-ga368196f0bd0' not in raw:
              raise SystemExit("FATAL: kernel version string does not match stock")
          i = raw.find(b'Linux version ')
          if i >= 0:
              print("version:", raw[i:i+120].split(b'\x00')[0].decode('utf-8','replace'))
          print("IMAGE VERIFY OK")
          PYEOF
          echo "VERIFY ALL OK"

      - name: Package artifact
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifact"
          cp kernel/out/arch/arm64/boot/Image.gz-dtb "$GITHUB_WORKSPACE/artifact/" || true
          cp kernel/out/.config "$GITHUB_WORKSPACE/artifact/config.txt" || true
          cp "$GITHUB_WORKSPACE/build.log" "$GITHUB_WORKSPACE/artifact/build.log" || true
          echo "FLAVOR=KernelSU v0.9.5" > "$GITHUB_WORKSPACE/artifact/KSU_FLAVOR.txt"
          ls -la "$GITHUB_WORKSPACE/artifact/"
          cd "$GITHUB_WORKSPACE/artifact" && zip -r9 "$GITHUB_WORKSPACE/camellia-ksu-v095.zip" *
          ls -la "$GITHUB_WORKSPACE/camellia-ksu-v095.zip"

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: camellia-ksu-v0.9.5
          path: camellia-ksu-v095.zip
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-v095
          path: build.log
          if-no-files-found: warn
