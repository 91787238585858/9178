name: build-ksud-legacy

on:
  workflow_dispatch:

jobs:
  build-ksud:
    runs-on: ubuntu-latest
    steps:
      - name: Install rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android
          rustc -V

      - name: Install Android NDK
        run: |
          set -e
          curl -sSL -o /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-r27-linux.zip"
          unzip -q /tmp/ndk.zip -d /opt
          mv /opt/android-ndk-r27 /opt/ndk
          echo "NDK=/opt/ndk" >> $GITHUB_ENV
          ls /opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/ | grep aarch64 | head -5

      - name: Checkout KernelSU v2.1.2
        run: |
          git clone --depth 1 --branch v2.1.2 https://github.com/tiann/KernelSU.git ksu
          cd ksu && git log --oneline -1

      - name: Apply legacy mount patch
        run: |
          set -e
          curl -LSs -o ksu/userspace/ksud/src/mount.rs \
            https://raw.githubusercontent.com/91787238585858/9178/main/.github/ksu_patches/mount_414.rs
          test -s ksu/userspace/ksud/src/mount.rs
          grep -q 'legacy mount ext4' ksu/userspace/ksud/src/mount.rs
          echo "=== patch applied ==="
          grep -n 'legacy mount' ksu/userspace/ksud/src/mount.rs

      - name: Build ksud
        run: |
          set -e
          cd ksu/userspace/ksud
          export NDK=/opt/ndk
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/bin/aarch64-linux-android26-clang
          export CC_aarch64_linux_android=$TOOLCHAIN/bin/aarch64-linux-android26-clang
          export AR_aarch64_linux_android=$TOOLCHAIN/bin/llvm-ar
          export RANLIB_aarch64_linux_android=$TOOLCHAIN/bin/llvm-ranlib
          cargo build --release --target aarch64-linux-android 2>&1 | tail -30
          ls -la target/aarch64-linux-android/release/ksud

      - name: Upload ksud
        uses: actions/upload-artifact@v4
        with:
          name: ksud-legacy
          path: ksu/userspace/ksud/target/aarch64-linux-android/release/ksud
          if-no-files-found: error
