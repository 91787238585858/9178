name: Build Camellia KernelSU v0.9.5 (Stable)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build 4.14.186 + KernelSU v0.9.5
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Clone Xiaomi kernel source
        run: |
          git clone --depth=1 --branch=camellian-t-oss \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel
          cd kernel
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' Makefile

      - name: Integrate official KernelSU v2.1.2
        run: |
          cd kernel
          curl -LSs -o setup.sh \
            https://raw.githubusercontent.com/tiann/KernelSU/v2.1.2/kernel/setup.sh
          sh setup.sh v2.1.2
          test -e drivers/kernelsu || { echo "FATAL: no drivers/kernelsu"; exit 1; }
          grep -q kernelsu drivers/Makefile || { echo "FATAL: Makefile not patched"; exit 1; }
          grep -q drivers/kernelsu/Kconfig drivers/Kconfig || { echo "FATAL: Kconfig not patched"; exit 1; }
          echo "=== 4.14 compat shim (preflight-derived) ==="
          cat > drivers/kernelsu/ksu_414_compat.h <<'COMPAT'
          #ifndef _KSU_414_COMPAT_H
          #define _KSU_414_COMPAT_H
          #include <linux/types.h>
          #include <linux/uaccess.h>
          #include <linux/sched/task.h>
          #include <linux/task_work.h>
          #ifndef MODULE_IMPORT_NS
          #define MODULE_IMPORT_NS(x)
          #endif
          #ifndef TWA_RESUME
          #define TWA_RESUME 1
          #endif
          #ifndef TWA_SIGNAL
          #define TWA_SIGNAL 1
          #endif
          /* 4.14: upstream __strncpy_from_unsafe equivalent; never sleeps */
          static inline long strncpy_from_user_nofault(char *dst, const void __user *unsafe_addr, long count)
          {
          	long i = 0;
          	if (!dst || !unsafe_addr || count <= 0)
          		return -EINVAL;
          	pagefault_disable();
          	while (i < count - 1) {
          		char c;
          		if (__get_user(c, (const char __user *)unsafe_addr + i))
          			break;
          		dst[i] = c;
          		i++;
          		if (!c)
          			break;
          	}
          	if (count > 0)
          		dst[i < count ? i : count - 1] = '\0';
          	pagefault_enable();
          	return i;
          }
          #include <linux/fdtable.h>
          #include <linux/anon_inodes.h>
          #ifndef anon_inode_getfd_secure
          #define anon_inode_getfd_secure(name, fops, priv, flags, ctx) anon_inode_getfd(name, fops, priv, flags)
          #endif
          static inline int ksys_close_414(unsigned int fd)
          {
          	return __close_fd(current->files, fd);
          }
          #define ksys_close(fd) ksys_close_414(fd)
          #endif
          COMPAT
          grep -q 'ksu_414_compat.h' drivers/kernelsu/Makefile || echo 'ccflags-y += -include $(srctree)/drivers/kernelsu/ksu_414_compat.h' >> drivers/kernelsu/Makefile
          echo "--- compat header ---"
          head -12 drivers/kernelsu/ksu_414_compat.h
          tail -2 drivers/kernelsu/Makefile
          echo "KSU v2.1.2 integration OK"

      - name: Patch kernel source for build compatibility
        run: |
          cd kernel
          sed -i '/subdir-ccflags-y += -Werror/d' drivers/misc/mediatek/Makefile
          if [ -f drivers/kernelsu/seccomp_cache.c ]; then
            cat > drivers/kernelsu/seccomp_cache.c <<'SECCACHE'
          /* 4.14: struct seccomp_filter has no BPF cache. Instead of allow-listing
           * a single syscall we drop the filter for the current thread, which is
           * what upstream escape_with_root_profile() effectively achieves. */
          #include <linux/types.h>
          #include <linux/sched.h>
          #include <linux/seccomp.h>
          #include <linux/thread_info.h>

          struct seccomp_filter;

          void ksu_seccomp_clear_cache(struct seccomp_filter *filter, int nr)
          {
          }

          void ksu_seccomp_allow_cache(struct seccomp_filter *filter, int nr)
          {
          	if (!filter)
          		return;
          	clear_thread_flag(TIF_SECCOMP);
          #ifdef CONFIG_SECCOMP
          	current->seccomp.mode = 0;
          	current->seccomp.filter = NULL;
          #endif
          }
          SECCACHE
            echo "=== seccomp_cache stubbed ==="
            head -8 drivers/kernelsu/seccomp_cache.c
          fi
          # ---- 4.14 diagnostic: /proc/ksu_diag ----
          curl -LSs -o drivers/kernelsu/ksu_diag.c \
            https://raw.githubusercontent.com/91787238585858/9178/main/.github/ksu_patches/ksu_diag_proc.c
          test -s drivers/kernelsu/ksu_diag.c || { echo "FATAL: ksu_diag download failed"; exit 1; }
          grep -q 'ksu_diag' drivers/kernelsu/ksu_diag.c || { echo "FATAL: ksu_diag bad"; exit 1; }
          sed -i 's/^kernelsu-objs += file_wrapper.o$/kernelsu-objs += file_wrapper.o\nkernelsu-objs += ksu_diag.o/' drivers/kernelsu/Makefile
          sed -i 's/^module_init(kernelsu_init);$/extern int ksu_diag_init(void);\n__initcall(ksu_diag_init);\nmodule_init(kernelsu_init);/' drivers/kernelsu/ksu.c
          # 在 kernelsu_init 开头插入 proc 节点创建，用于验证它是否真的被执行
          echo "=== ksu_diag added ==="
          grep -n 'ksu_diag' drivers/kernelsu/Makefile drivers/kernelsu/ksu.c | head -5
          if [ -f drivers/kernelsu/supercalls.c ]; then
            sed -i 's/struct inode_security_struct \*sec = selinux_inode(wrapper_inode);/struct inode_security_struct *sec = wrapper_inode->i_security;/' drivers/kernelsu/supercalls.c
            echo "=== selinux_inode patched ==="
            grep -n 'i_security' drivers/kernelsu/supercalls.c | head -3
          fi
          if [ -f drivers/kernelsu/ksud.c ]; then
            python3 - <<'RCWIDEN'
          import io
          p = 'drivers/kernelsu/ksud.c'
          s = io.open(p, encoding='utf-8').read()
          a = 'if (strcmp(short_name, "atrace.rc")) {'
          b = 'if (strcmp(short_name, "atrace.rc") && !strstr(short_name, ".rc")) {'
          if a in s:
              s = s.replace(a, b, 1)
          c = 'if (strcmp(dpath, "/system/etc/init/atrace.rc")) {'
          d = 'if (strncmp(dpath, "/system/etc/init/", 17)) {'
          if c in s:
              s = s.replace(c, d, 1)
          io.open(p, 'w', encoding='utf-8').write(s)
          print('ksud.rc injection widened to any /system/etc/init/*.rc')
          RCWIDEN
            grep -n 'strncmp(dpath,\|strstr(short_name' drivers/kernelsu/ksud.c | head -4
          fi
          if [ -f drivers/kernelsu/throne_tracker.c ]; then
            sed -i 's|            bool is_manager = is_manager_apk(dirpath);|            bool is_manager;\n#ifdef KSU_MANAGER_PACKAGE\n            {\n                char _mt_pkg[KSU_MAX_PACKAGE_NAME];\n                is_manager = (get_pkg_from_apk_path(_mt_pkg, dirpath) == 0 \&\& strncmp(_mt_pkg, KSU_MANAGER_PACKAGE, sizeof(KSU_MANAGER_PACKAGE)) == 0) \|\| is_manager_apk(dirpath);\n            }\n#else\n            is_manager = is_manager_apk(dirpath);\n#endif|' drivers/kernelsu/throne_tracker.c
            echo "=== throne_tracker manager match patched ==="
            grep -n 'KSU_MANAGER_PACKAGE' drivers/kernelsu/throne_tracker.c | head -5
          fi
          if [ -f drivers/kernelsu/selinux/selinux.c ]; then
            sed -i 's/selinux_cred(cred)/(const struct task_security_struct *)(cred->security)/g' drivers/kernelsu/selinux/selinux.c
            echo "=== selinux_cred patched ==="
            grep -n 'cred->security' drivers/kernelsu/selinux/selinux.c | head -3
          fi
          if [ -f drivers/kernelsu/setuid_hook.c ]; then
            sed -i 's/force_sig(SIGKILL);/force_sig(SIGKILL, current);/g' drivers/kernelsu/setuid_hook.c
            echo "=== force_sig patched (xiaomi 4.14 uses 2-arg) ==="
            grep -n 'force_sig' drivers/kernelsu/setuid_hook.c || true
          fi
          if [ -f drivers/kernelsu/pkg_observer.c ]; then
            cat > drivers/kernelsu/pkg_observer.c <<'PKGOBS'
          /* 4.14: fsnotify API differs (handle_inode_event/fsnotify_add_inode_mark are 5.x) */
          #include <linux/types.h>

          #include <linux/workqueue.h>
          #include <linux/jiffies.h>

          extern void track_throne(void);

          static void ksu_observer_rescan(struct work_struct *w);
          static DECLARE_DELAYED_WORK(ksu_observer_work, ksu_observer_rescan);
          static int ksu_observer_retries = 6;

          static void ksu_observer_rescan(struct work_struct *w)
          {
          	track_throne();
          	if (--ksu_observer_retries > 0)
          		schedule_delayed_work(&ksu_observer_work, 20 * HZ);
          }

          int ksu_observer_init(void)
          {
          	/* 4.14: fsnotify API differs, so crown the manager here (post-fs-data) */
          	track_throne();
          	schedule_delayed_work(&ksu_observer_work, 20 * HZ);
          	return 0;
          }

          void ksu_observer_exit(void)
          {
          	cancel_delayed_work_sync(&ksu_observer_work);
          }
          PKGOBS
            echo "=== pkg_observer stubbed ==="
            head -6 drivers/kernelsu/pkg_observer.c
          fi
          if [ -f drivers/kernelsu/app_profile.c ]; then
            sed -i 's|^\s*atomic_set(&current->seccomp.filter_count, 0);|\t/* 4.14: struct seccomp has no filter_count */|' drivers/kernelsu/app_profile.c
            echo "=== filter_count patched ==="
            grep -n 'filter_count' drivers/kernelsu/app_profile.c || echo "no filter_count left"
          fi
          grep -rln 'cust\.dtsi>' arch/arm64/boot/dts/mediatek 2>/dev/null | xargs -r sed -i '/cust\.dtsi>/d'
          echo "=== mtk Werror lines left ==="
          grep -c 'Werror' drivers/misc/mediatek/Makefile || true
          echo "patch OK"

      - name: Backport path_umount from kernel 5.9
        run: |
          cd kernel
          if ! grep -q 'int path_umount' fs/namespace.c; then
            cat >> fs/namespace.c <<'PATHUMOUNT'

          int path_umount(struct path *path, int flags)
          {
          	struct mount *mnt;

          	if (!path)
          		return -EINVAL;
          	if (!may_mount())
          		return -EPERM;
          	if (path->dentry != path->mnt->mnt_root)
          		return -EINVAL;

          	mnt = real_mount(path->mnt);
          	if (mnt_want_write(path->mnt))
          		return -EROFS;

          	{
          		int ret = do_umount(mnt, flags);
          		mnt_drop_write(path->mnt);
          		return ret;
          	}
          }
          PATHUMOUNT
            echo "path_umount backported"
          fi
          grep -c 'int path_umount' fs/namespace.c

      - name: Install 4.14-compatible file_wrapper + sepolicy
        run: |
          cd kernel
          curl -LSs -o drivers/kernelsu/file_wrapper.c \
            https://raw.githubusercontent.com/91787238585858/9178/main/.github/ksu_patches/file_wrapper.c
          test -s drivers/kernelsu/file_wrapper.c || { echo "FATAL: file_wrapper download failed"; exit 1; }
          echo "=== file_wrapper.c replaced (4.14) ==="
          wc -l drivers/kernelsu/file_wrapper.c
          curl -LSs -o drivers/kernelsu/arch.h \
            https://raw.githubusercontent.com/91787238585858/9178/main/.github/ksu_patches/arch212.h
          test -s drivers/kernelsu/arch.h || { echo "FATAL: arch.h download failed"; exit 1; }
          grep -q 'sys_reboot' drivers/kernelsu/arch.h || { echo "FATAL: arch.h not patched"; exit 1; }
          echo "=== arch.h replaced (4.14 sys_* symbols) ==="
          grep -n 'sys_reboot\|REBOOT_SYMBOL' drivers/kernelsu/arch.h | head -6
          curl -LSs -o drivers/kernelsu/selinux/sepolicy.c \
            https://raw.githubusercontent.com/91787238585858/9178/main/.github/ksu_patches/sepolicy.c
          test -s drivers/kernelsu/selinux/sepolicy.c || { echo "FATAL: sepolicy download failed"; exit 1; }
          echo "=== sepolicy.c replaced (4.14 filename_trans) ==="
          wc -l drivers/kernelsu/selinux/sepolicy.c
          curl -LSs -o drivers/kernelsu/ksu.c \
            https://raw.githubusercontent.com/91787238585858/9178/main/.github/ksu_patches/ksu_414_diag.c
          test -s drivers/kernelsu/ksu.c || { echo "FATAL: ksu.c download failed"; exit 1; }
          grep -q 'ksu_step6_ksud' drivers/kernelsu/ksu.c || { echo "FATAL: ksu.c not patched"; exit 1; }
          echo "=== ksu.c replaced (init step markers) ==="
          grep -c 'ksu_mark' drivers/kernelsu/ksu.c

      - name: Patch rules.c policydb accessor for 4.14
        run: |
          cd kernel
          sed -i 's|    struct selinux_policy \*policy = selinux_state.policy;|#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 7, 0)\n    { struct selinux_ss *ss = selinux_state.ss; if (!ss) return NULL; db = \&ss->policydb; }\n#else\n    struct selinux_policy *policy = selinux_state.policy;|' drivers/kernelsu/selinux/rules.c
          sed -i 's|    db = \&policy->policydb;|    db = \&policy->policydb;\n#endif|' drivers/kernelsu/selinux/rules.c
          echo "=== rules.c get_policydb ==="
          grep -A9 'static struct policydb \*get_policydb' drivers/kernelsu/selinux/rules.c | head -12

      - name: Add vendor symbol stubs
        run: |
          cd kernel
          cat > drivers/misc/xiaomi_vendor_stub.c <<'VENDORSTUB'
          #include <linux/kernel.h>
          #include <linux/string.h>

          char *get_audio_pa_vendor(void)
          {
              return "awinic";
          }

          int get_huaqin_pcba_config(void)
          {
              return 0;
          }

          int hq_regiser_hw_info(void)
          {
              return 0;
          }

          char *stpcpy(char *dest, const char *src)
          {
              char *p = dest;
              while ((*p = *src++) != '\0')
                  p++;
              return p;
          }
          VENDORSTUB
          grep -q xiaomi_vendor_stub drivers/misc/Makefile || echo 'obj-y += xiaomi_vendor_stub.o' >> drivers/misc/Makefile
          echo "=== stub added ==="
          tail -2 drivers/misc/Makefile
          head -5 drivers/misc/xiaomi_vendor_stub.c

      - name: Skip module CRC verification
        run: |
          cd kernel
          python3 - <<'PYEOF'
          import io
          p = 'kernel/module.c'
          s = io.open(p, encoding='utf-8').read()
          marker = 'static int check_version('
          assert marker in s, 'check_version not found'
          i = s.index(marker)
          j = s.index('{', i)
          s = s[:j+1] + '\n\treturn 1; /* patched: skip symbol CRC verification */' + s[j+1:]
          io.open(p, 'w', encoding='utf-8').write(s)
          print('module.c patched: CRC verification disabled')
          PYEOF
          grep -A3 'static int check_version(' kernel/module.c | head -8

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc libssl-dev bison flex \
            libelf-dev zip unzip git curl python3 perl rsync cpio binutils \
            device-tree-compiler kmod
          sudo apt-get install -y -qq libncurses-dev || true

      - name: Download toolchains
        run: |
          mkdir -p toolchain/clang toolchain/gcc64 toolchain/gcc32
          wget -q --no-check-certificate -O /tmp/clang.tar.gz \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b/archive/refs/heads/lineage-20.0.tar.gz
          tar xzf /tmp/clang.tar.gz -C /tmp
          mv /tmp/android_prebuilts_clang_kernel_linux-x86_clang-r416183b-*/* toolchain/clang/
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            toolchain/gcc64
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            toolchain/gcc32
          rm -f toolchain/clang/bin/ld
          echo "$PWD/toolchain/clang/bin" >> $GITHUB_PATH
          echo "$PWD/toolchain/gcc64/bin" >> $GITHUB_PATH
          echo "$PWD/toolchain/gcc32/bin" >> $GITHUB_PATH
          ls toolchain/clang/bin/clang
          ls toolchain/gcc64/bin/aarch64-linux-android-gcc

      - name: Configure kernel
        run: |
          cd kernel
          D=arch/arm64/configs/camellian_defconfig
          set_config() {
            if grep -q "^# $1 is not set" "$3"; then
              sed -i "s/^# $1 is not set/$1=$2/" "$3"
            elif grep -q "^$1=" "$3"; then
              sed -i "s/^$1=.*/$1=$2/" "$3"
            else
              echo "$1=$2" >> "$3"
            fi
          }
          set_config CONFIG_KSU y $D
          # v2.1.2 hooks the setuid/execve syscalls via tracepoints, which only
          # exist when FTRACE_SYSCALLS is enabled. Without it the manager never
          # receives its fd and stays in the "unsupported" state.
          set_config CONFIG_FTRACE_SYSCALLS y $D
          set_config CONFIG_FTRACE y $D
          set_config CONFIG_TRACING y $D
          set_config CONFIG_HAVE_SYSCALL_TRACEPOINTS y $D
          set_config CONFIG_KPROBES y $D
          set_config CONFIG_HAVE_KPROBES y $D
          set_config CONFIG_KPROBE_EVENTS y $D
          set_config CONFIG_MODULES y $D
          set_config CONFIG_EXT4_FS y $D
          set_config CONFIG_MILLET n $D
          set_config CONFIG_SYSTEM_TRUSTED_KEYRING n $D
          set_config CONFIG_MODULE_SIG n $D
          set_config CONFIG_DEBUG_INFO n $D
          set_config CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE n $D
          set_config CONFIG_LOCALVERSION '"-perf-ga368196f0bd0"' $D
          set_config CONFIG_LOCALVERSION_AUTO n $D
          make O=out ARCH=arm64 camellian_defconfig
          echo "=== config ==="
          grep -E "CONFIG_KSU=|CONFIG_EXT4_FS=|CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE|CONFIG_LOCALVERSION" out/.config
          grep -q "^CONFIG_KSU=y" out/.config || { echo "FATAL: KSU off"; exit 1; }
          echo "config OK"

      - name: Build kernel Image.gz
        run: |
          cd kernel
          HF="-Wall -Wmissing-prototypes -Wstrict-prototypes"
          HF="$HF -O2 -fomit-frame-pointer -std=gnu89"
          HF="$HF -Wno-error -Wno-deprecated-declarations"
          HF="$HF -Wno-implicit-function-declaration"
          export LOCALVERSION=
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LD=ld.lld \
            KSU_MANAGER_PACKAGE=me.weishu.kernelsu \
            HOSTCFLAGS="$HF" \
            KCFLAGS="-Wno-error -Wno-pointer-to-int-cast -Wno-int-to-pointer-cast" \
            Image.gz \
            > ../build.log 2>&1 || {
            echo "BUILD FAILED - error lines:"
            grep -n -i -E "error:|fatal error" ../build.log | head -40
            echo "--- tail ---"
            tail -60 ../build.log
            exit 1
          }
          echo "BUILD SUCCESS"
          ls -la out/arch/arm64/boot/

      - name: Verify kernel image
        run: |
          cd kernel
          test -f out/vmlinux || { echo "FATAL: no vmlinux"; exit 1; }
          nm out/vmlinux | grep -i ksu | head -10 || true
          if ! (nm out/vmlinux | grep -qi ksu || strings out/vmlinux | grep -qi kernelsu); then
            echo "FATAL: no KSU symbols in vmlinux"
            exit 1
          fi
          if ! strings out/vmlinux | grep -q "4.14.186-perf-ga368196f0bd0"; then
            echo "FATAL: version string mismatch"
            exit 1
          fi
          if strings out/vmlinux | grep -q "ga368196f0bd0+"; then
            echo "FATAL: version string has trailing plus (vermagic mismatch)"
            exit 1
          fi
          if ! strings out/vmlinux | grep -q "me.weishu.kernelsu"; then
            echo "FATAL: KSU_MANAGER_PACKAGE not compiled in"
            exit 1
          fi
          echo "vermagic exact-match OK"
          test -f out/arch/arm64/boot/Image.gz || { echo "FATAL: no Image.gz"; exit 1; }
          ls -la out/arch/arm64/boot/Image.gz
          python3 -c "import zlib;d=open('out/arch/arm64/boot/Image.gz','rb').read();o=zlib.decompressobj(16+zlib.MAX_WBITS);r=o.decompress(d);print('kernel decompressed: %.2f MB, tail %d bytes' % (len(r)/1048576, len(o.unused_data)))"
          echo "VERIFY OK"

      - name: Package artifact
        run: |
          mkdir -p artifact
          cp kernel/out/arch/arm64/boot/Image.gz artifact/ || true
          cp kernel/out/.config artifact/config.txt || true
          cp build.log artifact/build.log || true
          echo "FLAVOR=KernelSU v0.9.5" > artifact/KSU_FLAVOR.txt
          ls -la artifact/
          cd artifact
          zip -r9 ../camellia-ksu-v095.zip *
          cd ..
          ls -la camellia-ksu-v095.zip

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: camellia-ksu-v0.9.5
          path: camellia-ksu-v095.zip
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-v095
          path: build.log
          if-no-files-found: warn
